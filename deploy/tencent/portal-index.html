n:0 0 34px;line-height:1.7}.game .description{color:#b4cbc3}.action{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600}.arrow{font-size:23px;font-weight:400}.game .action{color:#e4dfaf}footer{padding-bottom:26px;font-size:12px;color:#948c9c;display:flex;justify-content:space-between;gap:12px}@media(max-width:620px){header,main,footer{width:calc(100% - 36px)}header{padding-top:23px}main{padding:48px 0}.apps{grid-template-columns:1fr;gap:18px}.app{padding:26px;min-height:260px}h1{margin-bottom:26px}.icon{margin-bottom:18px}footer{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){.app{transition:none}.app:hover{transform:none}}
