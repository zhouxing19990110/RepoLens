name: repolens
services:
  app:
    image: ${REPOLENS_IMAGE:?Set REPOLENS_IMAGE to the verified release tag}
    env_file:
      - ../../.env
    environment:
      ROOT_PATH: /repolens
    networks:
      gateway:
        aliases:
          - repolens
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  gateway:
    external: true
    name: wolin-cloud_frontend
