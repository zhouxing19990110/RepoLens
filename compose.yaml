name: repolens-local
services:
  app:
    image: repolens:local
    build:
      context: .
      args:
        APP_BASE_PATH: /
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ROOT_PATH: ""
    ports:
      - "127.0.0.1:8081:8000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
